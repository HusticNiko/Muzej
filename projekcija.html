<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projektor – Nadzor</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3a1e1b; --panel:#4b2522; --gold:#d4af37; --gold-dark:#b38f24; --text:#f5e9cc;
  }
  html,body{height:100%;margin:0}
  body{
    background: radial-gradient(1200px 800px at 50% 20%, #532a26 0%, var(--bg) 70%);
    color: var(--text);
    font-family:'Cinzel','Times New Roman',Times,serif;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{
    width:min(920px,96vw); padding:clamp(16px,3vw,28px);
    background:linear-gradient(180deg,var(--panel),#3f201d);
    border:2px solid var(--gold); border-radius:14px;
    box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 20px rgba(212,175,55,.08);
  }
  .title{display:flex;justify-content:center;margin:4px 0 18px}
  .title h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em;text-transform:uppercase}
  .grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  button{
    appearance:none;border:none;cursor:pointer;border-radius:12px;
    padding:clamp(16px,4.5vw,28px); font-size:clamp(18px,3.8vw,26px);
    font-family:'Cinzel','Times New Roman',Times,serif; color:#2a1a0a;
    background:
      radial-gradient(140% 220% at 50% -20%, #fff5cc33 0%, transparent 60%),
      linear-gradient(180deg,var(--gold),var(--gold-dark));
    border:2px solid #a5821d; text-shadow:0 1px 0 #fff9;
    box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 #fff6cf66;
    transition:transform .05s ease, filter .15s ease;
  }
  button:active{transform:translateY(1px) scale(.99)}
  button:hover{filter:brightness(1.03)}
  .wide{grid-column:span 2}
  .log{
    margin-top:12px;   font-family: "Cinzel", serif;
    font-size:14px; color:#e9e1c9; background:#2f1714; border:1px solid #6a3a31;
    padding:8px 10px; border-radius:8px; min-height:2.4em; max-height:35vh; overflow:auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title"><h1>Kontrola Projekcije</h1></div>

    <div class="grid">
      <button id="btnCol1" class="wide">Projekcija</button>
      <button id="btnCol2" class="wide">Ambiental</button>
    </div>
    <label class="wide" style="display:flex;gap:12px;align-items:center; margin-top: 20px;">
  <span style="min-width:120px">Glasnost</span>
  <input id="audioSlider" type="range" min="0" max="1" step="0.01" value="1" style="flex:1">
  <span id="audioPct" style="width:52px;text-align:right">100%</span>
</label>


    <div id="log" class="log"></div>
  </div>

<script>
  const BASE = ''; // '' if served from Resolume host:port; otherwise 'http://192.168.1.12:8080'
  const LAYERS = [1,2,3]; // set your 1-based layer indices
  const COL1 = 1, COL2 = 2;

  let lastTriggeredColumn = null;

  function log(msg){
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString();
    el.textContent = `[${t}] ${msg}\n` + el.textContent;
  }

  async function http(path, method='POST', body=null){
    const opt = { method, headers:{} };
    if(body !== null){ opt.headers['Content-Type']='application/json'; opt.body = JSON.stringify(body); }
    const res = await fetch(BASE + path, opt);
    if(!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    try { return await res.json(); } catch { return {}; }
  }

  // ---------- Column Trigger ----------
  async function triggerColumn(idx){
    await http(`/api/v1/composition/columns/${idx}/connect`, 'POST');
    lastTriggeredColumn = idx;
    log(`Stolpec ${idx} zagnan.`);
  }

  // ---------- Pause/Resume via SPEED ----------
  const SELECTED_SPEED_PATH = `/api/v1/composition/selectedclip/transport/position/speed`;
  function clipSpeedPath(L,C){ return `/api/v1/composition/layers/${L}/clips/${C}/transport/position/speed`; }

  async function setSpeedSelected(v){ await http(SELECTED_SPEED_PATH, 'PUT', { value: v }); }
  async function setSpeedClip(L,C,v){ await http(clipSpeedPath(L,C), 'PUT', { value: v }); }

  async function pauseComposition(){
    if(lastTriggeredColumn != null){
      await Promise.all(LAYERS.map(L => setSpeedClip(L, lastTriggeredColumn, 0)));
      log(`Pavza (speed=0): stolpec ${lastTriggeredColumn} čez vse sloje.`);
    } else {
      await setSpeedSelected(0);
      log(`Pavza (speed=0): izbran posnetek.`);
    }
  }

  async function playComposition(){
    if(lastTriggeredColumn != null){
      await Promise.all(LAYERS.map(L => setSpeedClip(L, lastTriggeredColumn, 1)));
      log(`Nadaljuj (speed=1): stolpec ${lastTriggeredColumn} čez vse sloje.`);
    } else {
      await setSpeedSelected(1);
      log(`Nadaljuj (speed=1): izbran posnetek.`);
    }
  }

  // ---------- AUDIO VOLUME SLIDER ----------
  // We auto-detect the first endpoint that works, then cache it.
  // Master (composition) candidates:
  const AUDIO_CANDIDATES_MASTER = [
    `/api/v1/composition/layergroups/selected/audio/volume`,
    '/api/v1/composition/audio/volume',
    '/api/v1/composition/audio/gain',
    // If your Swagger shows nested nodes, add them here, e.g.:
    // '/api/v1/composition/audio/volume/gain'
  ];
  // Selected clip candidates:
  const AUDIO_CANDIDATES_SELECTED = [
    `/api/v1/composition/layergroups/selected/audio/volume`,
    '/api/v1/composition/selectedclip/audio/volume',
    '/api/v1/composition/selectedclip/audio/gain',
    // '/api/v1/composition/clips/selected/audio/volume', // if your build uses this naming
    // '/api/v1/composition/clips/selected/audio/gain'
  ];
  // Per-clip format:
  function audioClipCandidates(L,C){
    return [
      `/api/v1/composition/layergroups/selected/audio/volume`,
      `/api/v1/composition/layers/${L}/clips/${C}/audio/volume`,
      `/api/v1/composition/layers/${L}/clips/${C}/audio/gain`,
      // `/api/v1/composition/layers/${L}/clips/${C}/audio/volume/gain`,
    ];
  }

  let AUDIO_SETTER = null;  // fn: async (value) => void
  let AUDIO_GETTER = null;  // fn: async () => number|undefined

  async function tryPut(path, value){
    try { await http(path, 'PUT', { value }); return true; } catch { return false; }
  }
  async function tryGet(path){
    try { const j = await http(path, 'GET'); return (typeof j?.value === 'number') ? j.value : undefined; } catch { return undefined; }
  }

  async function detectAudioPath(){
    if(AUDIO_SETTER) return; // already detected

    // 1) Try composition master
    for(const p of AUDIO_CANDIDATES_MASTER){
      if(await tryPut(p, 1)) {
        AUDIO_SETTER = (v) => http(p, 'PUT', { value: v });
        AUDIO_GETTER = () => tryGet(p);
        log(`Audio: master endpoint OK (${p})`);
        return;
      }
    }

    // 2) Try selected clip
    for(const p of AUDIO_CANDIDATES_SELECTED){
      if(await tryPut(p, 1)) {
        AUDIO_SETTER = (v) => http(p, 'PUT', { value: v });
        AUDIO_GETTER = () => tryGet(p);
        log(`Audio: selected-clip endpoint OK (${p})`);
        return;
      }
    }

    // 3) Fall back to lastTriggeredColumn across layers
    if(lastTriggeredColumn != null){
      // detect the first clip path that works, then set all layers on change
      for(const L of LAYERS){
        const candidates = audioClipCandidates(L, lastTriggeredColumn);
        for(const p of candidates){
          if(await tryPut(p, 1)){
            AUDIO_SETTER = async (v) => {
              await Promise.all(LAYERS.map(Li => {
                const pp = p.replace(`/layers/${L}/clips/${lastTriggeredColumn}/`, `/layers/${Li}/clips/${lastTriggeredColumn}/`);
                return http(pp, 'PUT', { value: v });
              }));
            };
            AUDIO_GETTER = () => tryGet(p);
            log(`Audio: per-clip endpoint OK (${p}), will set all layers in column ${lastTriggeredColumn}`);
            return;
          }
        }
      }
    }

    throw new Error('Audio endpoint not found. Check Swagger for the exact audio volume/gain path and add it to the candidates.');
  }

  // Hook up the UI
  const audioSlider = document.getElementById('audioSlider');
  const audioPct    = document.getElementById('audioPct');

  async function setAudioUIFromAPI(){
    try{
      await detectAudioPath();
      const v = await (AUDIO_GETTER ? AUDIO_GETTER() : undefined);
      if(typeof v === 'number'){
        audioSlider.value = v.toFixed(2);
        audioPct.textContent = Math.round(v*100) + '%';
      }
    }catch(e){ log('Audio detect: ' + e.message); }
  }

  audioSlider.addEventListener('input', async (e) => {
    const v = parseFloat(e.target.value);
    audioPct.textContent = Math.round(v*100) + '%';
    try {
      await detectAudioPath();
      await AUDIO_SETTER(v);
    } catch(err){
      log('Audio set failed: ' + err.message);
    }
  });

  // ---------- Buttons ----------
  document.getElementById('btnCol1').onclick = async () => { try { await triggerColumn(COL1); await setAudioUIFromAPI(); } catch(e){ log('Napaka: '+e.message); } };
  document.getElementById('btnCol2').onclick = async () => { try { await triggerColumn(COL2); await setAudioUIFromAPI(); } catch(e){ log('Napaka: '+e.message); } };
  document.getElementById('btnPause').onclick = async () => { try { await pauseComposition(); } catch(e){ log('Napaka: '+e.message); } };
  document.getElementById('btnResume').onclick = async () => { try { await playComposition(); } catch(e){ log('Napaka: '+e.message); } };

  // Try to read current value on load (won't break if not available)
  setAudioUIFromAPI();
</script>


</body>
</html>
