<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Resolume Remote — Minimal</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg:#3a1e1b;
    --panel:#4b2522;
    --gold:#d4af37;
    --gold-dark:#b38f24;
    --text:#f5e9cc;
    --muted:#e9d9b9;
  }

  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% 20%, #532a26 0%, var(--bg) 70%);
    color:var(--text);
    font-family:'Cinzel','Times New Roman',Times,serif;
    display:grid;
    place-items:center;
    min-height:100vh;
    padding:20px;
  }

  .wrap{
    width:100%;
    max-width:480px;
    background:linear-gradient(180deg,var(--panel),#3f201d);
    border:2px solid var(--gold);
    border-radius:14px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 20px rgba(212,175,55,.08);
  }

  .card{
    background:rgba(0,0,0,0.12);
    border:1px solid var(--gold-dark);
    border-radius:12px;
    padding:18px;
    box-shadow:inset 0 0 12px rgba(0,0,0,.35);
  }

  h1{
    margin:0 0 12px;
    font-size:22px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.04em;
    text-align:center;
  }

  .grid{
    display:grid;
    gap:14px;
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  button{
    appearance:none;
    border:none;
    cursor:pointer;
    border-radius:12px;
    padding:16px 20px;
    font-size:16px;
    font-family:'Cinzel','Times New Roman',Times,serif;
    color:#2a1a0a;
    background:
      radial-gradient(140% 220% at 50% -20%, #fff5cc33 0%, transparent 60%),
      linear-gradient(180deg,var(--gold),var(--gold-dark));
    border:2px solid #a5821d;
    text-shadow:0 1px 0 #fff9;
    box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 #fff6cf66;
    transition:transform .05s ease, filter .15s ease;
  }
  button:hover{ filter:brightness(1.05); }
  button:active{ transform:translateY(1px) scale(.99); }

  .full-span{
    grid-column:1 / -1;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Resolume Remote</h1>
    <div class="grid">
      <button onclick="playProjection(1)">▶︎ Projekcija</button>
      <button onclick="playProjection(2)">▶︎ Ambiental</button>
      <button onclick="playProjection(3)">⏸ Pause</button>
      <button class="full-span" onclick="goBack()">Nazaj</button>
    </div>
  </div>
</div>

<script>
  // ================== CONFIGURATION ==================
  // Change these to match your Resolume setup
  const HOST = '192.168.1.19';
  const PORT = '8080';
  const PASSWORD = '';          // leave empty if no password

  const LAYER_P1 = 1;           // layer used when triggering Projection 1
  const LAYER_P2 = 2;           // layer used when triggering 2,3,4 (fallback)

  const DUR_C1 = 10;            // seconds: C1 duration before auto → C4 loop
  const DUR_C2 = 10;            // seconds: retrigger interval for C2 loop
  const DUR_C3 = 10;            // seconds: C3 duration before auto → C2 loop
  const DUR_C4 = 10;            // seconds: retrigger interval for C4 loop
  // ===================================================

  // ----- helpers -----
  function log(msg){
    console.log('[Resolume]', msg);
  }

  function baseUrl(){
    return `http://${HOST}:${PORT}`;
  }

  function authHeaders(){
    if (!PASSWORD) return {};
    const token = btoa(`:${PASSWORD}`); // empty username + password
    return { 'Authorization': `Basic ${token}` };
  }

  async function sendBool(url, val, methods=['POST','PUT','PATCH']){
    const bodies = [
      { ct:'application/json', body:JSON.stringify(val) },
      { ct:'text/plain',       body: val ? 'true':'false' },
      { ct:'application/json', body:JSON.stringify(val?1:0) },
      { ct:'text/plain',       body: val ? '1':'0' },
    ];

    const tries = [];
    for (const m of methods){
      for (const b of bodies){
        try{
          const r = await fetch(url, {
            method:m,
            headers:{ 'Content-Type':b.ct, ...authHeaders() },
            body:b.body
          });
          const info = `${m} ${b.ct} ${url} → ${r.status}`;
          tries.push(info);
          log(info);
          if (r.ok) return { ok:true, attempt:info };
        }catch(e){
          const info = `${m} ${b.ct} ${url} → ERROR`;
          tries.push(info);
          log(info);
        }
      }
    }
    return { ok:false, tries };
  }

  function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // ----- PULSE column connect (true → short delay → false) -----
  async function pulseColumnConnect(col){
    const url = `${baseUrl()}/api/v1/composition/columns/${col}/connect`;
    let res = await sendBool(url, true);
    await sleep(120);
    res = await sendBool(url, false);
    return true;
  }

  // ----- Direct clip trigger fallback (Layer X + Column Y) with pulse -----
  async function pulseClipConnect(layer, col){
    const url = `${baseUrl()}/api/v1/composition/layers/${layer}/clips/${col}/connect`;
    let res = await sendBool(url, true);
    await sleep(120);
    res = await sendBool(url, false);
    return true;
  }

  // ====== SIMPLE SEQUENCER / LOOPING (client-side timers) ======
  let loopTimer  = null;  // for looping columns (2 and 4)
  let followTimer = null; // for 1→4 and 3→2 transitions

  function clearAllTimers(){
    if (loopTimer){
      clearTimeout(loopTimer);
      loopTimer = null;
    }
    if (followTimer){
      clearTimeout(followTimer);
      followTimer = null;
    }
  }

  function goBack(){
    window.location.href = "http://192.168.1.19:3000";
    // or your LAN React app:
    // window.location.href = "http://192.168.x.x:3000";
  }

  async function playProjection(n){
    clearAllTimers();
    log(`Play Projection ${n}`);

    // decide which layer to use for fallback
    const layer = (n === 1) ? LAYER_P1 : LAYER_P2;

    try{
      await pulseColumnConnect(n);
      log(`Projection ${n} triggered via column ${n}`);
    }catch(e){
      log(`Column ${n} pulse error: ${e}`);
      try{
        await pulseClipConnect(layer, n);
        log(`Projection ${n} triggered via layer ${layer}, column ${n}`);
      }catch(e2){
        log(`Projection ${n} failed (fallback error: ${e2})`);
        return;
      }
    }

    // sequencing rules:
    // C1 plays once → auto C4 (loop)
    // C2 loops
    // C3 plays once → auto C2 (loop)
    // C4 loops (for the C1→C4 path)
    if (n === 1){
      const dur = DUR_C1;
      if (dur > 0){
        followTimer = setTimeout(() => {
          log('C1 finished → auto start C4 (loop)');
          playLoopingColumn(4, DUR_C4);
        }, dur * 1000);
      }
    } else if (n === 2){
      playLoopingColumn(2, DUR_C2);
    } else if (n === 3){
      const dur = DUR_C3;
      if (dur > 0){
        followTimer = setTimeout(() => {
          log('C3 finished → auto start C2 (loop)');
          playLoopingColumn(2, DUR_C2);
        }, dur * 1000);
      }
    } else if (n === 4){
      playLoopingColumn(4, DUR_C4);
    }
  }

  async function playLoopingColumn(col, durSeconds){
    clearAllTimers();
    log(`Start looping column ${col}`);
    await pulseColumnConnect(col);

    if (durSeconds > 0){
      const loopOnce = async () => {
        log(`Retrigger column ${col} (loop)`);
        await pulseColumnConnect(col);
        loopTimer = setTimeout(loopOnce, durSeconds * 1000);
      };
      loopTimer = setTimeout(loopOnce, durSeconds * 1000);
    } else {
      log(`No duration set for column ${col}; loop timer not scheduled.`);
    }
  }

  async function pause(){
    clearAllTimers();
    const url = `${baseUrl()}/api/v1/transport/pause`;
    log('Pause requested');
    try{
      const r = await fetch(url, { method:'POST', headers:{ ...authHeaders() } });
      log(`POST ${url} → ${r.status}`);
    }catch(e){
      log('Pause error: ' + e);
    }
  }
</script>
</body>
</html>
